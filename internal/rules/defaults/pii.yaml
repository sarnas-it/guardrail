rules:
  - id: phone_ru
    category: pii
    severity: warn
    description: Russian phone number
    regex: '(?:\+7|8)\s?\(?\d{3}\)?\s?\d{3}[- ]?\d{2}[- ]?\d{2}'

  - id: email
    category: pii
    severity: warn
    description: E-mail address
    regex: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'

  - id: inn_ru
    category: pii
    severity: warn
    description: Russian INN
    regex: '\b\d{10,12}\b'
    keywords: [инн, inn, иин, идентификационный номер]

  - id: snils_ru
    category: pii
    severity: warn
    description: Russian SNILS
    regex: '\b\d{3}[- ]?\d{3}[- ]?\d{3}[- ]?\d{2}\b'

  - id: passport_ru
    category: pii
    severity: warn
    description: Russian passport series and number
    regex: '\b\d{2}\s?\d{2}\s?\d{6}\b'
    keywords: [паспорт, passport, серия, паспортные]

  - id: full_name_ru
    category: pii
    severity: warn
    description: Russian full name (surname + given name + patronymic)
    type: dictionary
